name: Day-Ahead-Preise und Erzeugungsmix sammeln

on:
  schedule:
    # Alle 3 Stunden (Minute 12, um Stosszeiten bei GitHub zu vermeiden). So
    # steht "heute" fast den ganzen Tag ueber zur Verfuegung und "morgen"
    # erscheint bald nach der Veroeffentlichung (meist nachmittags), ohne bis
    # Mitternacht zu warten. Mehrfache Laeufe pro Tag sind unschaedlich.
    - cron: '12 */3 * * *'
  workflow_dispatch: {}   # erlaubt manuellen Start ueber den "Run workflow"-Knopf

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preise und Erzeugungsmix abrufen und speichern
        shell: pwsh
        run: ./sammle_daten.ps1

      - name: Aenderung committen und pushen
        run: |
          git config user.name "Preis-Sammler"
          git config user.email "actions@users.noreply.github.com"
          git add preishistorie.json erzeugung.json
          git diff --staged --quiet || git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%dT%H:%M))"
          git pull --rebase origin main
          git push
